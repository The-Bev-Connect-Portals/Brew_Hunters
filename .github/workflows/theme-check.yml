name: Theme Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          token: ${{ github.token }}
          flags: '--fail-level error'

  cart-tests:
    name: Cart regression tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Run cart tests
        run: node tests/cart-add.test.mjs
